name: Deploy
# Despliega en cPanel cuando la CI de un push a main termina en verde.
# También se puede lanzar a mano desde Actions > Deploy > Run workflow.
on:
  workflow_run:
    workflows: ["PHP and MariaDB"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Actualizar repositorio y desplegar con cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          REPO_ROOT: ${{ vars.CPANEL_REPO_ROOT }}
        run: |
          set -euo pipefail
          : "${CPANEL_HOST:?Falta el secreto CPANEL_HOST}" "${CPANEL_USER:?Falta el secreto CPANEL_USER}" "${CPANEL_TOKEN:?Falta el secreto CPANEL_TOKEN}"
          REPO_ROOT="${REPO_ROOT:-/home/$CPANEL_USER/repositories/moba-erp}"
          api() {
            local out code
            out=$(curl -sS --max-time 120 -w '\n%{http_code}' \
              -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
              "https://$CPANEL_HOST:2083/execute/$1" --data-urlencode "repository_root=$REPO_ROOT" "${@:2}") \
              || { echo "::error::No se pudo conectar con $CPANEL_HOST:2083"; exit 1; }
            code=${out##*$'\n'}; out=${out%$'\n'*}
            if [ "$code" != 200 ] || ! jq -e '.status == 1' >/dev/null 2>&1 <<<"$out"; then
              echo "::error::cPanel $1 falló (HTTP $code)"
              case "$code" in
                401|403) echo "cPanel rechaza las credenciales: revisar CPANEL_USER (usuario de cPanel, no el de Namecheap) y CPANEL_TOKEN (token completo, sin espacios).";;
              esac
              jq '{errors, messages}' <<<"$out" 2>/dev/null || sed -e 's/<[^>]*>//g' <<<"$out" | grep -v '^\s*$' | head -20
              exit 1
            fi
          }
          echo "Repositorio en el servidor: $REPO_ROOT"
          api VersionControl/update --data-urlencode "branch=main"
          if [ "$REPO_ROOT" = "/home/$CPANEL_USER/moba-erp" ]; then
            # El clon de cPanel es la propia carpeta de la web: el pull ya es el despliegue.
            echo "Repositorio actualizado; la web se sirve desde el propio clon."
          else
            api VersionControlDeployment/create
            echo "Despliegue solicitado a cPanel."
          fi
      - name: Comprobar la web
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://erp.mobacreativa.com/ || true)
            [ "$code" = 200 ] && { echo "La web responde 200."; exit 0; }
            sleep 10
          done
          echo "::error::La web no responde 200 (último código: $code)"; exit 1
